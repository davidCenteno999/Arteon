<div >
   <div class = "contariner_user_actions">
    <mat-card class="card1" appearance="outlined" >
        <mat-card-header>
            <mat-card-title>User Profile</mat-card-title>
           
         </mat-card-header>
         <mat-card-content>
            <br>
            <label>Username:</label>
            <label>{{ this.userService.user?.username }}</label>
            <br>
            <label>Email:</label>
            <label>{{ this.userService.user?.email }}</label>
         </mat-card-content>
         

    </mat-card>
    <mat-card class="card2" appearance="outlined">
        <mat-card-header>
            <mat-card-title>Acciones</mat-card-title>
        </mat-card-header>
        <mat-card-content class = "button_content">
                <button matButton="filled" (click)="createCatalog()">New Catalog</button>
                <button matButton="filled">See Recent </button>
                <button matButton="filled">AI Catalog</button>
        </mat-card-content>    
           
         
    </mat-card>
    </div>
</div>
