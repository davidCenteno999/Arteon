<div >
   <div class = "contariner_user_actions">
    <mat-card class="card1" appearance="outlined" >
        <mat-card-header>
            <mat-card-title>User Profile</mat-card-title>
           
         </mat-card-header>
         <mat-card-content>
            <br>
            <label>Username:</label>
            <label>{{ this.userService.user?.username }}</label>
            <br>
            <label>Email:</label>
            <label>{{ this.userService.user?.email }}</label>
         </mat-card-content>
         

    </mat-card>
    <div class = "conatiner_columns">
    <mat-card class="card2" appearance="outlined">
        <mat-card-header>
            <mat-card-title>Actions</mat-card-title>
        </mat-card-header>
        <mat-card-content class = "button_content">
                <button matButton="filled" (click)="createCatalog()">New Catalog</button>
                <button matButton="filled" (click)="getCatalogs()">See Recent </button>
                <button matButton="filled">AI Catalog</button>
        </mat-card-content>    
        
    </mat-card>
    
        <mat-card class="card2" appearance="outlined">
            <mat-card-header>
                <mat-card-title>Catalogs</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <table mat-table
                    [dataSource]="catalogData" multiTemplateDataRows 
                    class="mat-elevation-z8">
                 @for (column of columnsToDisplay; track column) {
                    <ng-container matColumnDef="{{column}}">
                    <th mat-header-cell *matHeaderCellDef>{{column}}</th>
                    <td mat-cell *matCellDef="let element">{{element[column]}}</td>
                    </ng-container>
                }
                 <ng-container matColumnDef="expand">
                    <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
                    <td mat-cell *matCellDef="let element">
                    <button
                        matIconButton
                        aria-label="expand row"
                        (click)="toggleExpand(element); $event.stopPropagation()"
                        class="example-toggle-button"
                        [class.example-toggle-button-expanded]="isExpanded(element)">
                        <mat-icon>keyboard_arrow_down</mat-icon>
                    </button>
                    </td>
                </ng-container>
                <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
                <ng-container matColumnDef="expandedDetail">
                    <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
                    <div class="example-element-detail-wrapper"
                        [class.example-element-detail-wrapper-expanded]="isExpanded(element)">
                        <div class="example-element-detail">
                        <div class="example-element-diagram">
                            <div class="example-element-position">{{element.name}}</div>
                            <div class="example-element-symbol">{{element.image}}</div>
                            <div class="example-element-name">{{element.visibility}}</div>
                            <div class="example-element-weight">{{element.likes}}</div>
                        </div>
                        <div class="example-element-description">
                            {{element.description}}
                            <span class="example-element-description-attribution"> -- Wikipedia </span>
                        </div>
                        </div>
                    </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
                <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand;"
                    class="example-element-row"
                    [class.example-expanded-row]="isExpanded(element)"
                    (click)="toggleExpand(element)">
                </tr>
                <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
                </table>





            </mat-card-content>
        </mat-card>
    </div>

    </div>

</div>
